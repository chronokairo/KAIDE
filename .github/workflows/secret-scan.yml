name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI is open source; the organization-only action wrapper requires a license.
      # Keep history scanning enabled: deleting a secret from HEAD does not revoke it.
      - name: Scan history with redacted output
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git /repo --config /repo/.gitleaks.toml --redact=100 --log-opts="--all"
      - name: Validate local Supabase credential handling
        if: ${{ !cancelled() }}
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s supabase/self-hosted/tests -v
