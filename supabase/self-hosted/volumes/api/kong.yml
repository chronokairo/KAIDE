_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: "${ANON_KEY}"
  - username: service_role
    keyauth_credentials:
      - key: "${SERVICE_ROLE_KEY}"

services:
  # Browser redirect endpoints must remain public; other auth routes require apikey.
  - name: auth-v1-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        paths: ["/auth/v1/verify"]

  - name: auth-v1-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-callback
        strip_path: true
        paths: ["/auth/v1/callback"]

  - name: auth-v1-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-authorize
        strip_path: true
        paths: ["/auth/v1/authorize"]

  - name: auth-v1
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: false
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: false
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/

  - name: realtime-v1
    plugins:
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: false
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      headers:
        - "*"
      exposed_headers:
        - "*"
      credentials: true
      max_age: 3600
