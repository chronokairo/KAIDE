# Supabase Self-Hosted para KAIDE (Control Plane & Agentes)
# Uso: docker compose -f supabase/self-hosted/docker-compose.yml --env-file supabase/self-hosted/.env up -d

services:
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KONG_HTTP_PORT:-8000}:8000/tcp"
      - "127.0.0.1:${KONG_HTTPS_PORT:-8443}:8443/tcp"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      ANON_KEY: ${ANON_KEY:?Generate deployment credentials with configure.py}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Generate deployment credentials with configure.py}
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    entrypoint: ["/bin/sh", "-ec", "/bin/sh /var/lib/kong/render-kong.sh && exec /docker-entrypoint.sh kong docker-start"]
    volumes:
      - ./volumes/api/kong.yml:/var/lib/kong/kong.template.yml:ro
      - ./volumes/api/render-kong.sh:/var/lib/kong/render-kong.sh:ro

  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Generate deployment credentials with configure.py}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3010}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-http://localhost:3010,http://127.0.0.1:3010}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Generate deployment credentials with configure.py}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_DISABLE_SIGNUP: "false"

  rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?Generate deployment credentials with configure.py}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Generate deployment credentials with configure.py}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    image: supabase/realtime:v2.30.23
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Generate deployment credentials with configure.py}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Generate deployment credentials with configure.py}
      REPLICATION_MODE: RLS
      REPLICATION_POLL_INTERVAL: 100
      SECURE_CHANNELS: "true"

  studio:
    image: supabase/studio:20240729-fa662aa
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_PORT:-3001}:3000/tcp"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deployment credentials with configure.py}
      DEFAULT_ORGANIZATION_NAME: "Chronokairo"
      DEFAULT_PROJECT_NAME: "KAIDE"
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Generate deployment credentials with configure.py}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Generate deployment credentials with configure.py}

  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?Generate deployment credentials with configure.py}

  db:
    image: supabase/postgres:15.6.1.143
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432/tcp"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deployment credentials with configure.py}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./volumes/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
