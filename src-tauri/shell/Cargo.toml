[package]
name = "chronokairo-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Casca Tauri fina do ChronoKairo Desktop — consome o núcleo zero-lib ckc."

[lib]
name = "chronokairo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Auto-update do desktop (P0 distribuição): o par updater/process permite
# checar/atualizar e reiniciar a aplicação após instalar.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Núcleo zero-lib (fonte de verdade do código Rust): a casca apenas o consome.
ckc = { path = "../core" }
# Harness de OSINT e Due Diligence
chronokairo-intelligence = { path = "../intelligence" }

[features]
default = []
