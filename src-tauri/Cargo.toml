[workspace]
resolver = "2"
members = ["shell", "intelligence"]

# Inteligência: crate `intelligence` (OSINT & Due Diligence Harness).
# Casca: crate `shell` (Tauri) que consome a inteligência e o núcleo zero-lib
# `ckc`, que mora no repo próprio `chronokairo/cli` (ver ADR-0027).

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
