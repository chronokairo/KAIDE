[workspace]
resolver = "2"
members = ["core", "shell", "intelligence"]

# Núcleo: crate zero-lib `ckc` (core) — fonte de verdade do código Rust.
# Inteligência: crate `intelligence` (OSINT & Due Diligence Harness).
# Casca: crate `shell` (Tauri) que consome o núcleo e inteligência.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
