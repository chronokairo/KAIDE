[package]
name = "ckc"
version = "0.1.0"
edition = "2021"
description = "ChronoKairo CLI (CKC) — Zero-Lib coding agent & context harness"

[lib]
name = "ckc"
path = "src/lib.rs"

[[bin]]
name = "ckc"
path = "src/main.rs"

[features]
default = ["gpu"]
gpu = ["dep:ocl"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ocl = { version = "0.19", optional = true }

# --- microsoft/edit-inspired build optimization (-65% bin size) ---
# Perfis de build ficam no workspace root (src-tauri/Cargo.toml).

# Build-time i18n filtering (edit: EDIT_CFG_LANGUAGES)
[package.metadata.edit]
languages = "en,pt-BR,es,fr,de,ja,zh"

