[package]
name = "kaide-intelligence"
version = "0.1.0"
description = "Chronokairo Intelligence Platform - Automated OSINT & Due Diligence Core"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
sha2 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "blocking"] }
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
regex = "1"
tl = "0.7"
rand = "0.8"
rayon = "1.5"
bytemuck = "1"
toml = "0.8"
tauri = { version = "2", default-features = false, optional = true }

[features]
default = []
desktop = ["dep:tauri"]
gpu = []

[lib]
name = "kaide_intelligence"
path = "src/lib.rs"
crate-type = ["rlib"]
