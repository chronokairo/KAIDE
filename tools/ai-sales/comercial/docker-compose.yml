services:
  postgres:
    image: postgres:16-alpine
    container_name: anna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anna
      POSTGRES_PASSWORD: anna
      POSTGRES_DB: anna
    ports:
      - "5432:5432"
    volumes:
      - anna_pgdata:/var/lib/postgresql/data

volumes:
  anna_pgdata:
