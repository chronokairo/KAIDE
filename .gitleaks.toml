# Gitleaks: secret scanning (Chronokairo / Kaide open source)
[extend]
useDefault = true

[[allowlists]]
description = "Placeholders, redaction regexes and synthetic test fixtures"
regexes = [
  '''REDACTED_[A-Z_]+''',
  '''nvapi-x{10,}''',
  '''your-(dev-)?project-ref''',
  # jwt.io sample token used by compressor redaction tests
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.[A-Za-z0-9_-]+''',
]
paths = [
  '''docs/market/changelogs/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)Cargo\.lock$''',
]

# Detect Resend keys independently of surrounding variable names or entropy.
[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '\bre_[A-Za-z0-9_-]{20,}\b'
keywords = ["re_"]

# Exact public model identifier, restricted to the LM Studio test fixtures.
[[allowlists]]
description = "LM Studio model identifier is not an API credential"
condition = "AND"
paths = ['''^tools/anamnesic-sdk/src/features/providers/lmstudio/src/(models|stream|setup)\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^qwen3-8b-instruct$''']

[[allowlists]]
description = "Synthetic input for SHA-256 hashing unit test"
condition = "AND"
paths = ['''^tools/context/packages/core/src/utils/__tests__/crypto\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^test-api-key-12345$''']